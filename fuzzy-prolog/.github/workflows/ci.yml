name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy
      - run: python -m pytest --cov=src --cov-report=term-missing
      - name: Course examples
        run: |
          fuzzyprolog examples/coupe.pl -q "p1(X, Y)." -q "p2(X, Y)." -q "p3(X, Y)." -q "p4(X, Y)."
          fuzzyprolog examples/humeur.pl -q "est_de_bonne_humeur(X)." --explain
          identitylink evaluate
