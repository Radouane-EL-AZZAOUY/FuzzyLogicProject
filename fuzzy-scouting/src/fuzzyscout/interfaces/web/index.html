<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6b45'/%3E%3Cpath d='M6 22 L13 10 L19 10 L26 22' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/recherche" aria-label="Fuzzy Scouting, accueil">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor" opacity=".16"/>
        <path d="M6 22 L13 10 L19 10 L26 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span>Fuzzy Scouting</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/recherche" data-tab="recherche">Recherche</a>
      <a href="#/comparer" data-tab="comparer">Comparer <span class="count" id="cmp-count"></span></a>
      <a href="#/simulateur" data-tab="simulateur">Simulateur</a>
      <a href="#/regles" data-tab="regles">Règles</a>
      <a href="#/selection" data-tab="selection">Sélection <span class="count" id="star-count"></span></a>
    </nav>
  </header>

  <main id="view" tabindex="-1"><p class="loading">Chargement des bases de connaissances…</p></main>

  <dialog id="sheet" class="sheet" aria-label="Fiche joueur"></dialog>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    // Ouverte directement depuis le disque, la page ne peut joindre ni ses fichiers ni l'API.
    if (location.protocol === "file:") {
      document.getElementById("view").innerHTML =
        "<h1>Cette page doit être ouverte via le serveur</h1>" +
        "<p>Dans le dossier <code>fuzzy-scouting</code>, lancez <code>fuzzyscout serve</code>, " +
        'puis ouvrez <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a>.</p>';
    }
  </script>
  <script src="/ui/app.js" defer></script>
</body>
</html>
