# Catalogue des postes évalués.
# Chaque poste chaîne des bases de connaissances (étapes) ; les sorties d'une étape
# alimentent les suivantes. La dernière étape produit la variable finale « aptitude ».
# Ajouter un poste = ajouter une entrée ici (et, si besoin, un fichier technique/<poste>.toml).

