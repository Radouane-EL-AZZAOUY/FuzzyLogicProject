# Technique du gardien : taux d'arrêts, buts encaissés, jeu au pied.

[system]
name = "technique_gardien"
description = "Score technique d'un gardien de but"

[[inputs]]
ref = "arrets_pct"
[[inputs]]
ref = "buts_encaisses_p90"
[[inputs]]
ref = "precision_passes_pct"

[[outputs]]
ref = "technique"

