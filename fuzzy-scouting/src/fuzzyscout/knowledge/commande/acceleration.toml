# Accélération : déduite de la vitesse de changement, de la distance de
# déplacement et du temps de réaction.
#
# Barème : chaque mesure rapporte 2 points (favorable), 1 point (intermédiaire) ou
# 0 point (défavorable). Les 27 combinaisons sont couvertes :
#   total 4 à 6 -> fort   |   total 3 -> moyenne   |   total 0 à 2 -> faible

[system]
name = "commande_acceleration"
description = "Accélération du joueur déduite de trois mesures"

[[inputs]]
ref = "vitesse_changement_ms2"
[[inputs]]
ref = "distance_deplacement_m"
[[inputs]]
ref = "temps_reaction_s"

[[outputs]]
ref = "acceleration"

[[rules]]
id = "A1"
text = "SI vitesse_changement_ms2 EST elevee ET distance_deplacement_m EST longue ET temps_reaction_s EST court ALORS acceleration EST fort"

