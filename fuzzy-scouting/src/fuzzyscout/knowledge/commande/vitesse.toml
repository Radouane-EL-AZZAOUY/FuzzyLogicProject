# Vitesse : déduite de la vitesse de pointe, du temps sur 30 m et du nombre de sprints.
#
# Barème : chaque mesure rapporte 2 points (favorable), 1 point (intermédiaire) ou
# 0 point (défavorable). Les 27 combinaisons sont couvertes :
#   total 4 à 6 -> fort   |   total 3 -> moyenne   |   total 0 à 2 -> faible

[system]
name = "commande_vitesse"
description = "Vitesse du joueur déduite de trois mesures"

[[inputs]]
ref = "vitesse_max_kmh"
[[inputs]]
ref = "temps_30m_s"
[[inputs]]
ref = "sprints_p90"

[[outputs]]
ref = "vitesse"

[[rules]]
id = "V1"
text = "SI vitesse_max_kmh EST rapide ET temps_30m_s EST court ET sprints_p90 EST eleve ALORS vitesse EST fort"

