# Niveau du joueur : décision finale à partir des trois variables linguistiques déduites.
#
# Barème : fort = 2 points, moyenne = 1 point, faible = 0 point. Les 27 combinaisons
# sont couvertes ; seule la combinaison fort-fort-fort atteint le niveau 6.
#   total 6 -> niveau 6 | 5 -> niveau 5 | 4 -> niveau 4 | 3 -> niveau 3
#   total 1 ou 2 -> niveau 2 | total 0 -> niveau 1

[system]
name = "commande_niveau"
description = "Niveau du joueur à partir de sa vitesse, de son accélération et de son tacle"

[[inputs]]
ref = "vitesse"
[[inputs]]
ref = "acceleration"
[[inputs]]
ref = "tacle"

[[outputs]]
ref = "niveau"

[[rules]]
id = "N1"
text = "SI vitesse EST fort ET acceleration EST fort ET tacle EST fort ALORS niveau EST niveau_6"

[[rules]]
id = "N2"
text = "SI vitesse EST fort ET acceleration EST fort ET tacle EST moyenne ALORS niveau EST niveau_5"

