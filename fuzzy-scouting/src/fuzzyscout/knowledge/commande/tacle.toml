# Tacle : déduit du volume de tacles, de leur taux de réussite et des fautes commises.
#
# Barème : chaque mesure rapporte 2 points (favorable), 1 point (intermédiaire) ou
# 0 point (défavorable). Les 27 combinaisons sont couvertes :
#   total 4 à 6 -> fort   |   total 3 -> moyenne   |   total 0 à 2 -> faible

[system]
name = "commande_tacle"
description = "Qualité de tacle du joueur déduite de trois mesures"

[[inputs]]
ref = "tacles_p90"
[[inputs]]
ref = "tacles_reussis_pct"
[[inputs]]
ref = "fautes_p90"

[[outputs]]
ref = "tacle"

[[rules]]
id = "T1"
text = "SI tacles_p90 EST eleve ET tacles_reussis_pct EST eleve ET fautes_p90 EST faible ALORS tacle EST fort"

