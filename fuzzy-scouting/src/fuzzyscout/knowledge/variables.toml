moyen = { kind = "triangle", params = [1.0, 1.6, 2.2] }
eleve = { kind = "ramp_up", params = [1.9, 2.5] }

# --- les trois variables linguistiques déduites (même échelle, mêmes termes)

[[variables]]
name = "vitesse"
description = "Vitesse du joueur (déduite)"
unit = "/100"
universe = [0, 100]
[variables.terms]
faible = { kind = "trapezoid", params = [0, 0, 20, 45] }
moyenne = { kind = "triangle", params = [25, 50, 75] }
fort = { kind = "trapezoid", params = [55, 80, 100, 100] }

[[variables]]
name = "acceleration"
description = "Accélération du joueur (déduite)"
unit = "/100"
universe = [0, 100]
[variables.terms]
faible = { kind = "trapezoid", params = [0, 0, 20, 45] }
moyenne = { kind = "triangle", params = [25, 50, 75] }
fort = { kind = "trapezoid", params = [55, 80, 100, 100] }

[[variables]]
name = "tacle"
description = "Qualité de tacle du joueur (déduite)"
unit = "/100"
universe = [0, 100]
[variables.terms]
faible = { kind = "trapezoid", params = [0, 0, 20, 45] }
moyenne = { kind = "triangle", params = [25, 50, 75] }
fort = { kind = "trapezoid", params = [55, 80, 100, 100] }

# --- sortie finale : six niveaux, un triangle centré sur chaque niveau

[[variables]]
name = "niveau"
description = "Niveau du joueur (1 = le plus bas, 6 = le plus haut)"
unit = "/6"
universe = [0, 7]
[variables.terms]
niveau_1 = { kind = "triangle", params = [0, 1, 2] }
niveau_2 = { kind = "triangle", params = [1, 2, 3] }
niveau_3 = { kind = "triangle", params = [2, 3, 4] }
niveau_4 = { kind = "triangle", params = [3, 4, 5] }
niveau_5 = { kind = "triangle", params = [4, 5, 6] }
niveau_6 = { kind = "triangle", params = [5, 6, 7] }
