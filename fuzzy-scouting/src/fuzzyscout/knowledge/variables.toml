# Même échelle [0, 100] et mêmes termes pour tous les scores, ce qui rend les étapes
# composables : la sortie d'une étape est directement une entrée de la suivante.

[[variables]]
name = "technique"
description = "Score technique spécifique au poste"
unit = "/100"
universe = [0, 100]
[variables.terms]
