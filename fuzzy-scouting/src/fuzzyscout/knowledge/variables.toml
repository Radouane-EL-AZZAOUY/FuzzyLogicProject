# ----------------------------------------------------------------- commande Scout
# Système hiérarchique : chaque variable linguistique (vitesse, accélération, tacle) est
# DÉDUITE de trois mesures, puis les trois variables déterminent le niveau du joueur.
# Voir knowledge/commande/ et docs/10-commande-scout.md.

# --- mesures dont se déduit la vitesse (avec vitesse_max_kmh, définie plus haut)

[[variables]]
name = "temps_30m_s"
description = "Temps sur 30 m lancé"
unit = "s"
universe = [3.5, 5.5]
[variables.terms]
court = { kind = "ramp_down", params = [4.0, 4.2] }
moyen = { kind = "triangle", params = [4.1, 4.3, 4.5] }
long = { kind = "ramp_up", params = [4.4, 4.6] }

[[variables]]
name = "sprints_p90"
description = "Sprints (> 25 km/h) par 90 minutes"
unit = "sprints/90"
universe = [0, 40]
[variables.terms]
faible = { kind = "ramp_down", params = [10, 15] }
moyen = { kind = "triangle", params = [12, 18, 24] }
eleve = { kind = "ramp_up", params = [21, 26] }

# --- mesures dont se déduit l'accélération

[[variables]]
name = "vitesse_changement_ms2"
description = "Vitesse de changement (variation de vitesse au démarrage)"
unit = "m/s²"
universe = [0, 8]
[variables.terms]
