# Bibliothèque des variables linguistiques partagées par toutes les bases de connaissances.
# Chaque variable = un univers de discours + des termes (prédicats flous) avec leur
# fonction d'appartenance. Formes : ramp_down(a,b) = 1 avant a, 0 après b ;
# ramp_up(a,b) = 0 avant a, 1 après b ; triangle(a,b,c) ; trapezoid(a,b,c,d).
# Les seuils proviennent d'ordres de grandeur usuels des statistiques « par 90 minutes ».

# ----------------------------------------------------------------- profil / contexte

[[variables]]
name = "age"
description = "Âge du joueur"
unit = "ans"
universe = [16, 40]
[variables.terms]
jeune = { kind = "ramp_down", params = [22, 25] }
prime = { kind = "triangle", params = [23, 28, 32] }
veteran = { kind = "ramp_up", params = [30, 33] }

[[variables]]
name = "taille_cm"
description = "Taille"
unit = "cm"
universe = [160, 205]
[variables.terms]
petit = { kind = "ramp_down", params = [172, 178] }
moyen = { kind = "triangle", params = [174, 181, 188] }
grand = { kind = "ramp_up", params = [184, 190] }

[[variables]]
name = "minutes_jouees"
