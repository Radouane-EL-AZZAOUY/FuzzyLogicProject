[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-scouting"
version = "0.1.0"
description = "Système d'aide au scouting de joueurs fondé sur la logique floue (moteur d'inférence générique + applications)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Radouane El Azzaouy" }]
keywords = ["fuzzy-logic", "inference", "scouting", "symbolic-ai", "mamdani"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
# Le cœur (fuzzyengine) et les applications CLI n'ont AUCUNE dépendance externe.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
fuzzyscout = "fuzzyscout.interfaces.cli:main"
fuzzyirrigation = "fuzzyirrigation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzyscout = ["knowledge/*.toml", "knowledge/*/*.toml", "data/*.csv", "interfaces/web/*", "py.typed"]
fuzzyirrigation = ["knowledge/*.toml", "py.typed"]
fuzzyengine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = ["slow: tests lents (benchmarks, gros volumes)"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères accentués français dans chaînes/commentaires

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["fuzzyengine", "fuzzyscout", "fuzzyirrigation"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*"]
ignore_missing_imports = true
